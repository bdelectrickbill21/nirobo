name: NewsHub update

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:          # lets you press "Run workflow" by hand

permissions:
  contents: write

concurrency:
  group: newshub
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The previous list, so a site that fails this time does not make its stories vanish.
      - name: Get the previous list
        run: |
          mkdir -p /tmp/prev
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/newsdata/news.json" -o /tmp/prev/news.json || true

      - name: Collect fresh news
        env:
          NIROBO_NEWS_OUT: /tmp/out
          NIROBO_NEWS_PREV: /tmp/prev/news.json
        run: python news_crawler.py

      # The list goes to its own branch called "newsdata". Netlify ignores that branch,
      # so updating the news never costs a Netlify publish (credit). The branch keeps only the latest list.
      - name: Publish to the newsdata branch
        run: |
          git config user.name "nirobo-bot"
          git config user.email "nirobo-bot@users.noreply.github.com"
          git checkout --orphan newsdata-tmp
          git rm -rf . > /dev/null 2>&1 || true
          cp /tmp/out/news.json /tmp/out/news_report.txt .
          git add news.json news_report.txt
          git commit -m "NewsHub update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force origin HEAD:newsdata
