name: Crawl
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 0"
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install scrapy
      - run: scrapy runspider crawler.py
      - name: Check results exist
        run: test -s data/index.json
      - name: Save results
        run: |
          git config user.name "nirobo-bot"
          git config user.email "nirobo-bot@users.noreply.github.com"
          git add data/index.json
          git commit -m "Update search index" || echo "No changes"
          git push
