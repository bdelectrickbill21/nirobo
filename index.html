<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Nirobo - Bangladeshi search engine</title>
<meta name="description" content="Nirobo: search in Bangla, Banglish and English, with guides for government services.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--green:#0E3B2C;--red:#C8323C;--ink:#17211C;--muted:#5B6B62;--line:#CFD6D1;--link:#1B4F9C}
*{box-sizing:border-box}
body{margin:0;border-top:5px solid var(--green);background:#fff;color:var(--ink);font-family:"Hind Siliguri","Noto Sans Bengali","Nirmala UI",system-ui,sans-serif;font-size:18px;line-height:1.6;min-height:100vh}
.hero{max-width:720px;margin:0 auto;padding:17vh 18px 0;text-align:center}
.logo{display:inline-block;font-size:68px;font-weight:700;line-height:1;letter-spacing:-1px;color:var(--green);text-decoration:none}
.logo i{display:inline-block;width:.56em;height:.56em;border-radius:50%;background:var(--red);margin-left:.04em}
.tag{margin:10px 0 0;color:var(--muted)}
.bar{position:relative;margin-top:26px;text-align:left}
.bar input{width:100%;border:1px solid var(--line);border-radius:30px;padding:14px 62px 14px 22px;font:inherit;color:var(--ink);background:#fff;box-shadow:0 1px 5px rgba(14,59,44,.12)}
.bar input:focus{outline:none;border-color:var(--green);box-shadow:0 2px 10px rgba(14,59,44,.22)}
.bar button.go{position:absolute;right:6px;top:6px;width:42px;height:42px;border:0;border-radius:50%;background:var(--green);cursor:pointer;display:grid;place-items:center}
.bar svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round}
button:focus-visible,a:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.sug{position:absolute;left:14px;right:14px;top:100%;margin:0;padding:6px 0;list-style:none;background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 18px 18px;z-index:5}
.sug button{width:100%;text-align:left;border:0;background:none;font:inherit;font-size:17px;padding:7px 14px;cursor:pointer;color:var(--ink)}
.sug button:hover{background:#EEF3F0}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:20px 0 0;padding:0;list-style:none}
.chips button{font:inherit;font-size:15px;border:1px solid var(--line);background:#fff;border-radius:20px;padding:3px 14px;cursor:pointer;color:var(--ink)}
.chips button:hover{border-color:var(--green)}
body.res .hero{padding-top:14px;text-align:left}
body.res .logo{font-size:30px;letter-spacing:0}
body.res .tag,body.res .chips{display:none}
body.res .bar{margin-top:10px}
.main{max-width:720px;margin:0 auto;padding:0 18px 40px}
#status{margin:18px 0 6px;color:var(--muted);font-size:16px}
.ans{border:1px solid var(--line);border-left:5px solid var(--green);border-radius:6px;padding:14px 16px;margin:18px 0 24px;background:#F6FAF7}
.ans b.lb{display:inline-block;background:var(--green);color:#fff;font-size:13px;font-weight:500;padding:0 10px;border-radius:10px}
.ans h2{font-size:22px;margin:6px 0 0;color:var(--green)}
.ans h3{font-size:16px;margin:12px 0 2px;color:var(--green)}
.ans ol,.ans ul{margin:0;padding-left:22px}
.ans a.btn{display:inline-block;margin-top:12px;background:var(--green);color:#fff;text-decoration:none;padding:6px 16px;border-radius:4px;font-weight:500}
.ans small{display:block;margin-top:10px;color:var(--muted);font-size:14px}
.r{margin:0 0 24px}
.r .u{font-size:14px;color:#0B5D3B;word-break:break-all}
.r a{display:block;font-size:20px;line-height:1.35;color:var(--link);text-decoration:none}
.r a:hover{text-decoration:underline}
.r p{margin:2px 0 0;font-size:16px;color:#3F4D45}
.foot{text-align:center;color:var(--muted);font-size:14px;padding:30px 18px}
.foot a{color:inherit}
.r a.rep{display:inline;font-size:13px;color:var(--muted);text-decoration:underline}
.tbar{display:none}
body.res .tbar{display:block}
.tabs{display:flex;gap:2px;margin:12px 0 0;padding:0;list-style:none;border-bottom:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs li{flex:none}
.tabs button{font:inherit;font-size:16px;white-space:nowrap;border:0;background:none;padding:6px 14px;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--green)}
.tabs button[aria-selected="true"]{color:var(--green);font-weight:500;border-bottom-color:var(--green)}
.tabs button.act{color:var(--green)}
.panel{margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;font-size:16px}
.panel[hidden],.adv[hidden],.more[hidden]{display:none}
.panel .opt{display:block;width:100%;text-align:left;border:0;background:none;font:inherit;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--ink)}
.panel .opt:hover{background:#EEF3F0}
.panel label{display:inline-block;margin:2px 14px 6px 0;color:var(--muted);font-size:15px}
.panel select,.panel input{font:inherit;font-size:16px;color:var(--ink);padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;margin-left:4px}
.adv label{display:block;margin:8px 0 0}
.adv input{display:block;width:100%;max-width:340px;margin:2px 0 0}
.lnk{border:0;background:none;font:inherit;font-size:15px;color:var(--link);text-decoration:underline;cursor:pointer;padding:6px 8px 6px 0}
#aGo,.more{font:inherit;font-weight:500;background:var(--green);color:#fff;border:0;border-radius:4px;padding:6px 18px;cursor:pointer;margin-top:10px}
.more{display:block;margin:6px auto 0}
.fm{font-size:18px;line-height:1.9;background:#fff;border:1px solid var(--line);border-radius:4px;padding:6px 12px;margin:8px 0;overflow-x:auto}
.fm div{white-space:pre-wrap}
.ans .wh{margin:6px 0 0;font-size:16px;color:#3F4D45}
.ans ol.st{margin:8px 0 0;padding-left:22px}
.qa code,.sugs code,.homeq code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em;background:#fff;border:1px solid var(--line);border-radius:4px;padding:0 6px;white-space:nowrap}
.qa p.qa-a{margin:8px 0 0;font-size:19px;line-height:1.6}
.qa ul.qa-l{margin:10px 0 0;padding-left:22px;line-height:1.9}
.qa .qa-m{margin-top:2px}
.qa .qa-btn{display:block;width:100%;margin:12px 0 0;padding:8px;border:1px solid var(--line);border-radius:20px;background:#fff;font:inherit;font-size:15px;color:var(--ink);cursor:pointer}
.qa .qa-btn:hover{border-color:var(--green)}
.qa .qa-src{margin-top:12px;padding-top:8px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.qa .qa-src a{color:var(--link)}
.qa .qa-rel{margin-top:12px}
.qa .qa-rel button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;font-size:16px;color:var(--link);padding:8px 2px;cursor:pointer}
.qa-acc{margin-top:12px}
.qa-acc h3{font-size:16px;margin:0 0 4px;color:var(--green)}
.qa-q{border-bottom:1px solid var(--line)}
.qa-qb{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;width:100%;text-align:left;border:0;background:none;font:inherit;font-size:17px;color:var(--ink);padding:10px 2px;cursor:pointer}
.qa-qb:hover{color:var(--green)}
.qa-ch{flex:none;color:var(--green);font-size:16px;line-height:1.7}
.qa-body{padding:0 2px 12px}
.qa-body[hidden]{display:none}
.qa-body .qa-a{font-size:17px;margin-top:2px}
.sugs{border:1px solid var(--line);border-left:5px solid var(--green);border-radius:6px;padding:10px 16px 4px;margin:18px 0 24px;background:#F6FAF7}
.sugs .qa-acc{margin-top:0}
.homeq{max-width:720px;margin:26px auto 0;text-align:left}
body.res .homeq{display:none}
.top{max-width:720px;margin:0 auto;padding:8px 18px 0;text-align:right;font-size:14px}
.top button{font:inherit;border:0;background:none;color:var(--muted);padding:3px 10px;border-radius:12px;cursor:pointer}
.top button:hover{color:var(--green)}
.top button[aria-pressed="true"]{color:var(--green);font-weight:500;background:#EEF3F0}
</style>
</head>
<body>
<nav class="top" id="langs" data-ia="langAria" aria-label="Language"><button type="button" data-ui="en">English</button><button type="button" data-ui="bl">Banglish</button><button type="button" data-ui="bn">বাংলা</button></nav>
<header class="hero">
  <a class="logo" href="/" id="home" data-ia="home" aria-label="Nirobo home">nirob<i></i></a>
  <p class="tag" data-i="tag"></p>

    <button class="go" type="submit" data-ia="sr" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg></button>
    <ul class="sug" id="sug" hidden></ul>
  </form>
  <div class="tbar">
    <ul class="tabs" id="tabs" role="tablist" data-ia="tabsAria" aria-label="Result types"></ul>

    <div class="panel" id="toolp" hidden>
      <label><span data-i="tTime"></span> <select id="fTime"><option value="0" data-i="t0"></option><option value="1" data-i="t1"></option><option value="7" data-i="t7"></option><option value="30" data-i="t30"></option><option value="365" data-i="t365"></option></select></label>
      <label><span data-i="tLang"></span> <select id="fLang"><option value="all" data-i="l_all"></option><option value="bn" data-i="l_bn"></option><option value="en" data-i="l_en"></option></select></label>
      <div><button type="button" class="lnk" id="advB" aria-expanded="false" data-i="adv"></button><button type="button" class="lnk" id="clrB" hidden data-i="clr"></button></div>
      <div class="adv" id="adv" hidden>
        <label><span data-i="aPh"></span><input id="aPh" autocomplete="off"></label>
        <label><span data-i="aEx"></span><input id="aEx" autocomplete="off"></label>
        <label><span data-i="aSite"></span><input id="aSite" placeholder="du.ac.bd" autocomplete="off"></label>
        <button type="button" id="aGo" data-i="go"></button>
      </div>
    </div>
  </div>
  <ul class="chips" id="chips"></ul>
  <div class="homeq" id="homeq"></div>
</header>

<main class="main">
  <p id="status" aria-live="polite"></p>
  <div id="guide"></div>
  <div id="web"></div>
</main>
<footer class="foot"><span data-i="made"></span> · <a href="/submit.html" data-i="submit"></a><br><span data-i="priv"></span></footer>

<script src="search-core.js"></script>
<script src="i18n.js"></script>
<script src="study.js"></script>

<script>
var $=function(i){return document.getElementById(i)},req=0;
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function plain(h){return new DOMParser().parseFromString(h||"","text/html").body.textContent}
var UI="en";
function T(k){var d=I18N[UI]||I18N.en;return d[k]!=null?d[k]:(I18N.en[k]!=null?I18N.en[k]:k)}
function F(k,o){return T(k).replace(/\{(\w+)\}/g,function(m,a){return o[a]!=null?o[a]:m})}
function nf(n){return UI==="bn"?bd(n):String(n)}
function getUI(){try{var v=localStorage.getItem("nirobo-ui");if(v&&I18N[v])return v}catch(e){}return"en"}
function applyStatic(){
 document.documentElement.lang=UI==="bn"?"bn":UI==="bl"?"bn-Latn":"en";
 [].forEach.call(document.querySelectorAll("[data-i]"),function(e){e.textContent=T(e.getAttribute("data-i"))});
 [].forEach.call(document.querySelectorAll("[data-ip]"),function(e){e.placeholder=T(e.getAttribute("data-ip"))});
 [].forEach.call(document.querySelectorAll("[data-ia]"),function(e){e.setAttribute("aria-label",T(e.getAttribute("data-ia")))});
 [].forEach.call(document.querySelectorAll("#langs button"),function(b){b.setAttribute("aria-pressed",b.getAttribute("data-ui")===UI?"true":"false")});
 drawTabs()}
function setUI(v){if(!I18N[v]||v===UI)return;UI=v;try{localStorage.setItem("nirobo-ui",v)}catch(e){}applyStatic();drawHomeQ();var q=$("q").value.trim();if(q)run(q,false);else document.title=T("title")}
function svc(s){var x=SVC_TR[s.link];return(UI!=="bn"&&x&&x[UI])?x[UI]:s}
function list(h,a,items,ord){a.appendChild(el("h3",0,h));var l=el(ord?"ol":"ul");items.forEach(function(x){l.appendChild(el("li",0,x))});a.appendChild(l)}
function guide(s){var x=svc(s),a=el("section","ans");a.appendChild(el("b","lb",T("gLabel")));a.appendChild(el("h2",0,x.t));
 list(T("gSteps"),a,x.steps,1);list(T("gDocs"),a,x.docs,0);
 var b=el("a","btn",T("gBtn"));b.href=s.link;b.target="_blank";b.rel="noopener noreferrer";a.appendChild(b);
 a.appendChild(el("small",0,T("gNote")));return a}
var MON={en:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],bn:["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"]};
function fdate(iso){var m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(iso||"");if(!m)return iso||"";var d=parseInt(m[3],10),mo=parseInt(m[2],10)-1,s=d+" "+(MON[UI]||MON.en)[mo]+" "+m[1];return UI==="bn"?bd(s):s}
var ANSWERS=null;
function loadAnswers(){if(!ANSWERS)ANSWERS=fetch("/data/answers.json").then(function(r){return r.ok?r.json():[]}).catch(function(){return[]}).then(function(a){return Array.isArray(a)?a:[]});return ANSWERS}
function loc(o){return o?(o[UI]||o.en||[]):[]}
function rich(t){var f=document.createDocumentFragment();String(t).split(/(\[\[.+?\]\])/).forEach(function(p){var m=/^\[\[(.+?)\]\]$/.exec(p);if(m)f.appendChild(el("code",0,m[1]));else if(p)f.appendChild(document.createTextNode(p))});return f}
function qaBody(c){var d=el("div","qa-body");var p=el("p","qa-a");p.appendChild(rich(loc(c.a)));d.appendChild(p);
 var ul=el("ul","qa-l");loc(c.items).forEach(function(x){var li=el("li");li.appendChild(rich(x));ul.appendChild(li)});d.appendChild(ul);
 var s=el("div","qa-src");s.appendChild(document.createTextNode(T("qa_src")+": "));
 if(c.src&&/^https:\/\//.test(c.src.url||"")){var l=el("a",0,c.src.name||c.src.url);l.href=c.src.url;l.target="_blank";l.rel="noopener noreferrer";s.appendChild(l)}else s.appendChild(document.createTextNode((c.src&&c.src.name)||""));
 s.appendChild(document.createTextNode(" · "+T("qa_checked")+" "+fdate(c.checked)));d.appendChild(s);return d}
function qaAcc(list,title){var w=el("div","qa-acc");if(title)w.appendChild(el("h3",0,title));
 list.forEach(function(c){var row=el("div","qa-q"),b=el("button","qa-qb"),ch=el("span","qa-ch","▾"),body=qaBody(c);body.hidden=true;
  b.type="button";b.setAttribute("aria-expanded","false");b.appendChild(el("span",0,loc(c.q)));b.appendChild(ch);
  b.addEventListener("click",function(){var open=body.hidden;body.hidden=!open;b.setAttribute("aria-expanded",open?"true":"false");ch.textContent=open?"▴":"▾"});
  row.appendChild(b);row.appendChild(body);w.appendChild(row)});return w}
function drawHomeQ(){var h=$("homeq");h.innerHTML="";loadAnswers().then(function(a){if(!a.length)return;var s=qaAcc(a.slice(0,6),T("qa_pop"));h.innerHTML="";h.appendChild(s)})}
function answerCard(c,all){var a=el("section","ans qa");a.appendChild(el("b","lb",T("qa_label")));
 var p=el("p","qa-a");p.appendChild(rich(loc(c.a)));a.appendChild(p);
 var ul=el("ul","qa-l");loc(c.items).forEach(function(x){var li=el("li");li.appendChild(rich(x));ul.appendChild(li)});a.appendChild(ul);
 var more=loc(c.more);
 if(more.length){var md=el("div","qa-m");md.hidden=true;var ml=el("ul","qa-l");more.forEach(function(x){var li=el("li");li.appendChild(rich(x));ml.appendChild(li)});md.appendChild(ml);a.appendChild(md);
  var b=el("button","qa-btn",T("qa_more"));b.type="button";b.setAttribute("aria-expanded","false");
  b.addEventListener("click",function(){md.hidden=!md.hidden;b.textContent=T(md.hidden?"qa_more":"qa_less");b.setAttribute("aria-expanded",md.hidden?"false":"true")});a.appendChild(b)}
 var s=el("div","qa-src");s.appendChild(document.createTextNode(T("qa_src")+": "));
 if(c.src&&/^https:\/\//.test(c.src.url||"")){var l=el("a",0,c.src.name||c.src.url);l.href=c.src.url;l.target="_blank";l.rel="noopener noreferrer";s.appendChild(l)}else s.appendChild(document.createTextNode((c.src&&c.src.name)||""));
 s.appendChild(document.createTextNode(" · "+T("qa_checked")+" "+fdate(c.checked)));a.appendChild(s);
 a.appendChild(el("small",0,T("qa_warn")));
 var rel=(c.related||[]).map(function(id){return(all||[]).filter(function(x){return x.id===id})[0]}).filter(Boolean);
 if(rel.length)a.appendChild(qaAcc(rel,T("qa_rel")));
 return a}
function mn(s){return String(s).replace(/-/g,"−")}
function dg(s){return UI==="bn"?bd(s):String(s)}
function studyCard(q){var d=null;try{d=(typeof NiroboStudy!=="undefined")?NiroboStudy.answer(q):null}catch(e){}if(!d)return null;
 var a=el("section","ans");a.appendChild(el("b","lb",T("st_label")));
 if(d.k==="calc"){a.appendChild(el("h2",0,dg(d.val===null?d.expr:d.expr+" = "+mn(d.val))));if(d.val===null)a.appendChild(el("p","wh",T("st_big")));
  a.appendChild(el("small",0,T("st_calc")+(d.deg?" · "+T("st_deg"):"")));return a}
 if(d.k==="pct"){a.appendChild(el("h2",0,dg(d.p+"% × "+d.y+" = "+d.val)));a.appendChild(el("small",0,T("st_pctl")));return a}
 if(d.k==="eq"){
  if(d.deg===3){a.appendChild(el("h2",0,T("st_unsup")));return a}
  if(d.deg===0){a.appendChild(el("h2",0,d.same?T("st_same"):T("st_nosol")));return a}
  a.appendChild(el("h2",0,dg(mn(d.std))));a.appendChild(el("small",0,T(d.deg===1?"st_lin":"st_quad")));
  var l=el("ol","st"),v=d.v;
  if(d.deg===1){l.appendChild(el("li",0,T("st_std")+":  "+dg(mn(d.std))));l.appendChild(el("li",0,dg(v+" = "+mn(d.roots[0]))))}
  else{l.appendChild(el("li",0,T("st_std")+":  "+dg(mn(d.std))));
   l.appendChild(el("li",0,T("st_coef")+":  "+dg("a = "+mn(d.a)+",  b = "+mn(d.b)+",  c = "+mn(d.c))));
   l.appendChild(el("li",0,T("st_disc")+":  "+"D = b² − 4ac = "+dg(mn(d.D))));
   l.appendChild(el("li",0,T(d.kind==="two"?"st_two":d.kind==="one"?"st_one":"st_none")));
   l.appendChild(el("li",0,T("st_roots")+":  "+d.roots.map(function(r){return dg(v+" = "+mn(r))}).join(",   ")))}
  a.appendChild(l);return a}
 var f=d.f;a.appendChild(el("h2",0,f.t[UI]||f.t.en));
 var m=el("div","fm");f.lines.forEach(function(x){m.appendChild(el("div",0,x))});a.appendChild(m);
 a.appendChild(el("p","wh",T("st_note")+":  "+(f.w[UI]||f.w.en)));a.appendChild(el("p","wh",T("st_ex")+":  "+f.ex));
 if(f.tip)a.appendChild(el("p","wh",T("st_tip"+f.tip)));
 a.appendChild(el("small",0,T("st_check")));return a}
var INDEX=null,LASTQ="";
var TABS=[{k:"all"},{k:"news",g:["news"]},{k:"gov",g:["government"]},{k:"edu",g:["education","university"]},{k:"health",g:["health"],m:1},{k:"fin",g:["finance"],m:1}],TAB="all",LANG="all",TIME=0;
function inTab(p,k){var t=TABS.filter(function(x){return x.k===k})[0];return!t||!t.g||(p.tags||[]).some(function(g){return t.g.indexOf(g)>-1})}
function readState(){var u=new URLSearchParams(location.search),t=u.get("tab"),l=u.get("lang"),d=parseInt(u.get("time"),10);
 TAB=TABS.some(function(x){return x.k===t})?t:"all";LANG=(l==="bn"||l==="en")?l:"all";TIME=[1,7,30,365].indexOf(d)>-1?d:0}
function stateQS(){return(TAB!=="all"?"&tab="+TAB:"")+(LANG!=="all"?"&lang="+LANG:"")+(TIME?"&time="+TIME:"")}
function filtersOn(){return LANG!=="all"||TIME>0}
function setTab(k){$("morep").hidden=true;if(TAB!==k){TAB=k;run($("q").value,true)}}
function tabBtn(t){var li=el("li"),b=el("button",0,T("tab_"+t.k));b.type="button";b.setAttribute("role","tab");b.setAttribute("aria-selected",t.k===TAB?"true":"false");b.addEventListener("click",function(){setTab(t.k)});li.appendChild(b);return li}
function popBtn(label,panel,other,sel,act){var li=el("li"),b=el("button",0,label+" ▾");b.type="button";b.setAttribute("aria-haspopup","true");b.setAttribute("aria-expanded",$(panel).hidden?"false":"true");
 if(sel){b.setAttribute("role","tab");b.setAttribute("aria-selected",sel==="1"?"true":"false")}if(act)b.className="act";
 b.addEventListener("click",function(){var p=$(panel);p.hidden=!p.hidden;$(other).hidden=true;b.setAttribute("aria-expanded",p.hidden?"false":"true")});li.appendChild(b);return li}
function drawTabs(){var u=$("tabs");u.innerHTML="";
 TABS.forEach(function(t){if(!t.m)u.appendChild(tabBtn(t))});
 var cur=TABS.filter(function(t){return t.m&&t.k===TAB})[0];
 u.appendChild(popBtn(cur?T("tab_"+cur.k):T("more"),"morep","toolp",cur?"1":"0",0));
 u.appendChild(popBtn(T("tools")+(filtersOn()?" •":""),"toolp","morep",0,filtersOn()));
 var p=$("morep");p.innerHTML="";TABS.forEach(function(t){if(!t.m)return;var b=el("button","opt",T("tab_"+t.k));b.type="button";b.addEventListener("click",function(){setTab(t.k)});p.appendChild(b)});
 $("fTime").value=String(TIME);$("fLang").value=LANG;$("clrB").hidden=!filtersOn()}
function parseQ(q){var o={ph:[],ex:[],site:""},t=(q||"").replace(/[\u201C\u201D\u201E\u00AB\u00BB]/g,'"');
 t=t.replace(/"([^"]*)"/g,function(m,a){a=a.trim().toLowerCase();if(a)o.ph.push(a);return" "});
 t=t.replace(/(^|\s)site:(\S+)/gi,function(m,s,h){o.site=h.toLowerCase().replace(/^https?:\/\//,"").replace(/^www\./,"").replace(/[\/?#].*$/,"");return" "});
 t=t.replace(/(^|\s)-(\S+)/g,function(m,s,w){o.ex.push(w.toLowerCase());return" "});
 o.plain=t.replace(/\s+/g," ").trim();o.text=(o.plain+" "+o.ph.join(" ")).trim();return o}
function pass(p,o,cutoff){if(!inTab(p,TAB))return false;
 if(LANG!=="all"&&(p.lang||"en")!==LANG)return false;
 if(cutoff&&p.crawled&&p.crawled<cutoff)return false;
 if(o.site){var h=host(p.url);if(h!==o.site&&h.slice(-o.site.length-1)!=="."+o.site)return false}
 var hay=((p.title||"")+" "+(p.description||"")).toLowerCase(),i;
 for(i=0;i<o.ph.length;i++)if(hay.indexOf(o.ph[i])<0)return false;
 var all=hay+" "+(p.tags||[]).join(" ").toLowerCase()+" "+host(p.url);
 for(i=0;i<o.ex.length;i++)if(all.indexOf(o.ex[i])>-1)return false;
 return true}
function bd(n){return String(n).replace(/\d/g,function(d){return"০১২৩৪৫৬৭৮৯".charAt(d)})}
function loadIndex(){if(!INDEX)INDEX=Promise.all([
 fetch("/data/index.json").then(function(r){if(!r.ok)throw 0;return r.json()}),
 fetch("/data/library.json").then(function(r){return r.ok?r.json():[]}).catch(function(){return[]})
]).then(function(x){var lib=Array.isArray(x[1])?x[1]:[],seen={};lib.forEach(function(p){p.lib=true;seen[p.url]=1});return lib.concat(x[0].filter(function(p){return!seen[p.url]}))}).catch(function(e){INDEX=null;throw e});return INDEX}
function host(u){try{return new URL(u).hostname.replace(/^www\./,"")}catch(e){return ""}}
function mk(k){var e=k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),L="[\\p{L}\\p{M}\\p{N}]";
 return new RegExp("(?<!"+L+")"+e+(/[\u0980-\u09FF]/.test(k)?"":"(?:e?s)?(?!"+L+")"),"u")}
function rank(data,toks,tab){if(!toks.length)return[];if(tab&&tab!=="all")data=data.filter(function(p){return inTab(p,tab)});var re=toks.map(mk),qs=toks.map(skL);
 return data.map(function(p){var t=(p.title||"").toLowerCase(),d=(p.description||"").toLowerCase(),g=(p.tags||[]).join(" "),n=0,m=0;
  re.forEach(function(r,i){var h=0;if(r.test(t))h+=3;if(r.test(d))h+=1;if(r.test(g))h+=p.lib?5:2;if(!h&&okq(qs[i],toks[i])){var W=pw(p);if(ph(W.t,qs[i],toks[i]))h=2;else if(ph(W.d,qs[i],toks[i]))h=1}if(h){n+=h;m++}});
  return{p:p,n:(m===toks.length?n+5:n)+(p.lib&&m?4:0),m:m}}).filter(function(x){return x.m*2>=toks.length&&x.n>0}).sort(function(a,b){return b.n-a.n}).map(function(x){return x.p}).filter(function(p,i,a){var k=function(z){return host(z.url)+"|"+(z.title||"").toLowerCase()};return a.findIndex(function(q){return k(q)===k(p)})===i})}
function track(o){try{var b=JSON.stringify(o);if(!(navigator.sendBeacon&&navigator.sendBeacon("/api/event",new Blob([b],{type:"application/json"}))))fetch("/api/event",{method:"POST",body:b,keepalive:true})}catch(e){}}
function hideSug(){$("sug").hidden=true}
function sugg(v){var s=$("sug");s.innerHTML="";v=v.trim().toLowerCase();if(!v)return hideSug();
 var l=[],toks=tokens(v);
 CHIPS.forEach(function(c){if(c.indexOf(v)===0&&c!==v)l.push(c)});
 SERVICES.forEach(function(x){if(l.length<6&&toks.length&&score(x,toks)>=2)l.push(svc(x).t)});
 if(!l.length)return hideSug();
 l.forEach(function(t){var li=el("li"),b=el("button",0,t);b.type="button";b.addEventListener("mousedown",function(e){e.preventDefault();run(t,true)});li.appendChild(b);s.appendChild(li)});s.hidden=false}
function row(x){var r=el("div","r");var u=el("div","u",x.source+" · "+host(x.url)+" · "),rp=el("a","rep",T("report"));rp.href="submit.html?report="+encodeURIComponent(x.url)+"#report";u.appendChild(rp);r.appendChild(u);
 var a=el("a",0,x.title);a.href=x.url;a.target="_blank";a.rel="noopener noreferrer";["click","auxclick"].forEach(function(ev){a.addEventListener(ev,function(){track({t:"click",h:[host(x.url)]})})});r.appendChild(a);
 r.appendChild(el("p",0,x.description));return r}
function run(q,push){q=(q||"").trim();$("q").value=q;hideSug();$("morep").hidden=true;
 var g=$("guide"),w=$("web"),st=$("status");g.innerHTML="";w.innerHTML="";st.textContent="";
 if(!q){TAB="all";LANG="all";TIME=0;drawTabs();document.body.className="";document.title=T("title");if(push)history.pushState(0,"","/");return}
 document.body.className="res";document.title=q+" - "+(UI==="bn"?"নিরবো":"Nirobo");
 drawTabs();
 if(push)history.pushState(0,"","?q="+encodeURIComponent(q)+stateQS());
 var o=parseQ(q),toks=tokens(o.text),best=null,bn=0,t0=performance.now(),plain=!o.ph.length&&!o.ex.length&&!o.site;
 SERVICES.forEach(function(s){var n=score(s,toks);if(n>bn){bn=n;best=s}});
 var sc=(TAB==="all"&&!filtersOn())?studyCard(q):null;if(sc)g.appendChild(sc);
 if(best&&bn>=2&&plain&&!filtersOn()&&(TAB==="all"||TAB==="gov"))g.appendChild(guide(best));
 var cutoff=TIME?new Date(Date.now()-TIME*864e5).toISOString().slice(0,10):"";
 var id=++req;st.textContent=T("searching");
 Promise.all([loadIndex(),loadAnswers()]).then(function(rs){
  if(id!==req)return;var data=rs[0],ans=rs[1];
  var qc=null,sg=[];
  try{if(TAB==="all"&&!filtersOn()&&typeof NiroboAnswers!=="undefined"){qc=NiroboAnswers.find(q,ans);if(!qc&&plain)sg=NiroboAnswers.suggest(q,ans,5)}}catch(e){}
  if(qc)g.insertBefore(answerCard(qc,ans),g.firstChild);
  else if(sg.length){var box=el("section","sugs");box.appendChild(qaAcc(sg,T("qa_sug")));g.insertBefore(box,g.firstChild)}
  var pool=data.filter(function(p){return pass(p,o,cutoff)}),all=toks.length?rank(pool,toks):((o.site||o.ph.length)?pool:[]),hits=all.slice(0,10);
  if(q!==LASTQ){LASTQ=q;track({t:"search",n:all.length||(g.firstChild?1:0),h:hits.map(function(x){return host(x.url)}).filter(function(h,i,a){return h&&a.indexOf(h)===i})})}
  var sec=(performance.now()-t0)/1000,tm=sec<0.01?T("tmLess"):F("tm",{s:nf(sec.toFixed(2))});
  if(all.length)st.textContent=all.length===1?F("cnt1",{t:tm}):F(all.length>10?"cntBig":"cnt",{n:nf(all.length),t:tm});
  else st.textContent=g.firstChild?"":(TAB!=="all"||filtersOn()||!plain?T("noneTab"):T("none"));
  var shown=0,mb=el("button","more",T("showMore"));mb.type="button";w.appendChild(mb);
  function add(){all.slice(shown,shown+10).forEach(function(x){w.insertBefore(row(x),mb)});shown=Math.min(all.length,shown+10);mb.hidden=shown>=all.length}
  mb.addEventListener("click",add);add()
 }).catch(function(){if(id===req)st.textContent=T("loadErr")})}
$("f").addEventListener("submit",function(e){e.preventDefault();run($("q").value,true)});
$("q").addEventListener("input",function(){sugg(this.value)});
$("q").addEventListener("blur",function(){setTimeout(hideSug,120)});
$("home").addEventListener("click",function(e){e.preventDefault();run("",true)});
window.addEventListener("popstate",function(){readState();run(new URLSearchParams(location.search).get("q"),false)});
CHIPS.forEach(function(c){var li=el("li"),b=el("button",0,c);b.type="button";b.addEventListener("click",function(){run(c,true)});li.appendChild(b);$("chips").appendChild(li)});
[].forEach.call(document.querySelectorAll("#langs button"),function(b){b.addEventListener("click",function(){setUI(b.getAttribute("data-ui"))})});
$("fTime").addEventListener("change",function(){TIME=parseInt(this.value,10)||0;run($("q").value,true)});
$("fLang").addEventListener("change",function(){LANG=this.value;run($("q").value,true)});
$("clrB").addEventListener("click",function(){LANG="all";TIME=0;run($("q").value,true)});
$("advB").addEventListener("click",function(){var a=$("adv");a.hidden=!a.hidden;this.setAttribute("aria-expanded",a.hidden?"false":"true")});
$("aGo").addEventListener("click",function(){var o=parseQ($("q").value),ph=$("aPh").value.replace(/"/g,"").trim(),ex=$("aEx").value.trim().split(/\s+/).filter(Boolean),site=$("aSite").value.trim(),p=[o.plain];
 if(ph)p.push('"'+ph+'"');ex.forEach(function(w){p.push("-"+w.replace(/^-+/,""))});if(site)p.push("site:"+site);run(p.join(" ").trim(),true)});
UI=getUI();readState();applyStatic();drawHomeQ();
run(new URLSearchParams(location.search).get("q"),false);
</script>
